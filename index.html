<script>
  // Light/Dark mode, set before the page draws so it never flashes the wrong colours.
  // The choice is made in Settings > Appearance; until then Notely follows the device setting.
  (function () {
    var KEY = 'notely.appearance', mq = window.matchMedia ? matchMedia('(prefers-color-scheme: light)') : null;
    function saved() { try { var v = localStorage.getItem(KEY); return v === 'light' || v === 'dark' ? v : null; } catch (e) { return null; } }
    function current() { return saved() || (mq && mq.matches ? 'light' : 'dark'); }
    function apply(m) {
      document.documentElement.dataset.mode = m;
      var tc = document.querySelector('meta[name="theme-color"]'); if (tc) tc.content = m === 'light' ? '#f5f7fa' : '#0f141c';
    }
    // People who had picked one of the old light themes (Candy, Paper) start in Light.
    try { if (!saved() && /^(candy|paper)$/.test((JSON.parse(localStorage.getItem('notely.settings')) || {}).theme)) localStorage.setItem(KEY, 'light'); } catch (e) { /* ignore */ }
    window.NotelyMode = { get: current, set: function (m) { try { localStorage.setItem(KEY, m); } catch (e) { /* private mode */ } apply(m); } };
    apply(current());
    document.addEventListener('DOMContentLoaded', function () { apply(current()); });
    if (mq && mq.addEventListener) mq.addEventListener('change', function () { if (!saved()) apply(current()); });
  })();
</script>

<script>
  // Surface any startup error instead of a silent blank page.
  window.addEventListener('error', function (e) {
    var el = document.getElementById('app');
    if (el) el.innerHTML = '<div class="error" style="margin:1rem">Something went wrong while loading Notely:<br><code>' + (e.message || e) + '</code><br><small>Make sure the <b>js/</b> folder sits next to index.html.</small></div>';
  });
</script>
