<script>
  // Surface any startup error instead of a silent blank page.
  window.addEventListener('error', function (e) {
    var el = document.getElementById('app');
    if (el) el.innerHTML = '<div class="error" style="margin:1rem">Something went wrong while loading Notely:<br><code>' + (e.message || e) + '</code><br><small>Make sure the <b>js/</b> folder sits next to index.html.</small></div>';
  });
</script>
